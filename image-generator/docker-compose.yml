name: image_generating

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmall-avatar-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgres://tmall_avatar:tmall_avatar_dev@db:5432/tmall_avatar
      AVATAR_STORAGE_DIR: ${AVATAR_STORAGE_DIR:-./data/avatars}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8787}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8787}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-auto}
      ENABLE_TEST_PAYMENTS: ${ENABLE_TEST_PAYMENTS:-false}
      DEV_UNLIMITED_USAGE: ${DEV_UNLIMITED_USAGE:-false}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_KEY_TYPE: ${ALIPAY_KEY_TYPE:-PKCS8}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      IMAGE_BACKEND: ${IMAGE_BACKEND:-openai}
      LOCAL_MODEL_BASE_URL: ${LOCAL_MODEL_BASE_URL:-http://host.docker.internal:8000}
      LOCAL_MODEL_WIDTH: ${LOCAL_MODEL_WIDTH:-512}
      LOCAL_MODEL_HEIGHT: ${LOCAL_MODEL_HEIGHT:-512}
      LOCAL_MODEL_STEPS: ${LOCAL_MODEL_STEPS:-20}
      LOCAL_MODEL_CFG: ${LOCAL_MODEL_CFG:-7.5}
      LOCAL_MODEL_SEED: ${LOCAL_MODEL_SEED:--1}
      LOCAL_MODEL_TIMEOUT_MS: ${LOCAL_MODEL_TIMEOUT_MS:-240000}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://host.docker.internal:8188}
      COMFY_GENERATION_ENGINE: ${COMFY_GENERATION_ENGINE:-flux1}
      COMFY_PROMPT_MODE: ${COMFY_PROMPT_MODE:-flux1-qwen}
      COMFY_TRANSLATOR_CLIP_NAME: ${COMFY_TRANSLATOR_CLIP_NAME:-qwen_3_4b.safetensors}
      COMFY_TRANSLATOR_CLIP_TYPE: ${COMFY_TRANSLATOR_CLIP_TYPE:-flux2}
      COMFY_TRANSLATOR_MAX_LENGTH: ${COMFY_TRANSLATOR_MAX_LENGTH:-384}
      COMFY_TRANSLATOR_RETRIES: ${COMFY_TRANSLATOR_RETRIES:-1}
      COMFY_CHECKPOINT_NAME: ${COMFY_CHECKPOINT_NAME:-flux1-schnell-fp8.safetensors}
      COMFY_WIDTH: ${COMFY_WIDTH:-1024}
      COMFY_HEIGHT: ${COMFY_HEIGHT:-1024}
      COMFY_STEPS: ${COMFY_STEPS:-4}
      COMFY_CFG: ${COMFY_CFG:-1}
      COMFY_SAMPLER_NAME: ${COMFY_SAMPLER_NAME:-euler}
      COMFY_SCHEDULER: ${COMFY_SCHEDULER:-simple}
      COMFY_SEED: ${COMFY_SEED:--1}
      COMFY_POLL_INTERVAL_MS: ${COMFY_POLL_INTERVAL_MS:-1500}
      COMFY_MAX_POLL_ATTEMPTS: ${COMFY_MAX_POLL_ATTEMPTS:-120}
      COMFY_TIMEOUT_MS: ${COMFY_TIMEOUT_MS:-30000}
      COMFY_FLUX2_UNET_NAME: ${COMFY_FLUX2_UNET_NAME:-flux-2-klein-4b-fp8.safetensors}
      COMFY_FLUX2_CLIP_NAME: ${COMFY_FLUX2_CLIP_NAME:-qwen_3_4b.safetensors}
      COMFY_FLUX2_VAE_NAME: ${COMFY_FLUX2_VAE_NAME:-flux2-vae.safetensors}
      COMFY_FLUX2_STEPS: ${COMFY_FLUX2_STEPS:-4}
      COMFY_FLUX2_CFG: ${COMFY_FLUX2_CFG:-1}
      COMFY_FLUX2_SAMPLER_NAME: ${COMFY_FLUX2_SAMPLER_NAME:-euler}
      COMFY_FLUX2_SCHEDULER: ${COMFY_FLUX2_SCHEDULER:-simple}
      COMFY_FLUX2_SEED: ${COMFY_FLUX2_SEED:--1}
      COMFY_FLUX2_MASK_FEATHER: ${COMFY_FLUX2_MASK_FEATHER:-8}
      COMFY_EDIT_MAX_UPLOAD_MB: ${COMFY_EDIT_MAX_UPLOAD_MB:-10}
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data

  db:
    image: postgres:16-alpine
    container_name: tmall-avatar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tmall_avatar
      POSTGRES_USER: tmall_avatar
      POSTGRES_PASSWORD: tmall_avatar_dev
    ports:
      - "5432:5432"
    volumes:
      - tmall_avatar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmall_avatar -d tmall_avatar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tmall_avatar_pgdata:
