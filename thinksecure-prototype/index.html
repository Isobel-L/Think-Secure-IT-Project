<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ThinkSecure — prototype</title>
  <meta name="description" content="ThinkSecure prototype: four cyber-safety activities in one illustrated world.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-intro">
  <a class="skip" href="#copy">Skip to the current activity</a>

  <!-- Intro: "Think" then "Secure", then a landscape sweep into the world -->
  <div id="intro" aria-hidden="true">
    <div class="intro-logo" id="introLogo"></div>
    <svg class="intro-hills" viewBox="0 0 1600 1000" preserveAspectRatio="none">
      <path class="h" fill="#FBE9BA" d="M0 140 C200 40 380 40 560 120 C760 210 900 60 1100 70 C1300 80 1420 160 1600 110 V1000 H0Z"/>
      <path class="h" fill="#5445F0" d="M0 120 C160 180 320 40 520 70 C720 100 820 200 1040 150 C1240 100 1400 30 1600 90 V1000 H0Z"/>
      <path class="h" fill="#03A18B" d="M0 90 C220 20 400 150 640 120 C860 90 980 20 1180 60 C1380 100 1480 170 1600 140 V1000 H0Z"/>
      <path class="h" fill="#0F244C" d="M0 150 C180 70 420 60 600 140 C760 210 960 190 1120 110 C1280 40 1460 60 1600 130 V1000 H0Z"/>
      <path class="h" fill="#FCEBB7" d="M0 110 C240 40 420 120 620 90 C840 60 960 160 1200 130 C1380 110 1480 50 1600 80 V1000 H0Z"/>
    </svg>
    <div class="intro-sun"></div>
  </div>

  <header class="top">
    <a class="brand" href="#" aria-label="ThinkSecure, back to the first activity" id="brand"></a>
  </header>

  <!-- The world: four scenes share one stage; the mascot lives above them all -->
  <div id="stage" class="stage" aria-hidden="true">
    <div id="scenes"></div>
    <div id="mascotLayer" class="mascot-layer"></div>
  </div>

  <main id="copy" class="copy-layer" aria-live="polite"></main>

  <nav class="dock" aria-label="Activities">
    <button class="step prev" id="prev" aria-label="Previous activity">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/></svg>
    </button>
    <ol class="stops" id="stops"></ol>
    <button class="step next" id="next" aria-label="Next activity">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg>
    </button>
  </nav>

  <!-- Page curtain + stand-in activity screen -->
  <div id="curtain" aria-hidden="true"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path id="curtainPath" d="M0 100 H100 V100 H0Z"/></svg></div>
  <section id="activity" hidden aria-labelledby="actTitle">
    <div class="act-inner">
      <p class="eyebrow" id="actEyebrow"></p>
      <h2 id="actTitle"></h2>
      <p id="actBody"></p>
      <button class="cta" id="actBack">Back to activities</button>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
