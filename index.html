<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>ThinkSecure</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap">

    <link rel="stylesheet" href="css/site-header.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body class="is-intro">

    <a class="skip" href="#titleCard" data-i18n="home.skipLink">Skip to the current activity</a>


    <!-- Intro: "Think" then "Secure", then a landscape sweep into the world -->
    <div id="intro" aria-hidden="true">

        <div class="intro-logo" id="introLogo"></div>

        <svg class="intro-hills" viewBox="0 0 1600 1000" preserveAspectRatio="none">
            <path class="h" fill="#FBE9BA" d="M0 140 C200 40 380 40 560 120 C760 210 900 60 1100 70 C1300 80 1420 160 1600 110 V1000 H0Z"/>
            <path class="h" fill="#5445F0" d="M0 120 C160 180 320 40 520 70 C720 100 820 200 1040 150 C1240 100 1400 30 1600 90 V1000 H0Z"/>
            <path class="h" fill="#03A18B" d="M0 90 C220 20 400 150 640 120 C860 90 980 20 1180 60 C1380 100 1480 170 1600 140 V1000 H0Z"/>
            <path class="h" fill="#0F244C" d="M0 150 C180 70 420 60 600 140 C760 210 960 190 1120 110 C1280 40 1460 60 1600 130 V1000 H0Z"/>
            <path class="h" fill="#FCEBB7" d="M0 110 C240 40 420 120 620 90 C840 60 960 160 1200 130 C1380 110 1480 50 1600 80 V1000 H0Z"/>
        </svg>

        <div class="intro-sun"></div>

    </div>


    <!-- Layer 3: the same navigation as every activity page (css/site-header.css), so the four
         activities sit in exactly the same place before and after you go in -->
    <header class="il-header home-header">
        <a class="il-logo" id="brand" href="index.html" aria-label="ThinkSecure, back to the first activity" data-i18n-aria-label="home.brandLabel"></a>
        <nav class="il-nav" aria-label="Main navigation">
            <span class="il-ink" id="navInk" aria-hidden="true"></span>
            <a class="il-stop il-stop-home" href="index.html" id="navHome">
                <span class="il-stop-label" data-i18n="common.home">Home</span>
            </a>
            <a class="il-stop" href="pages/cyber-quiz.html" data-go="0" aria-controls="titleCard">
                <span class="il-stop-n" aria-hidden="true">1</span>
                <span class="il-stop-label" data-i18n="common.quiz">Cyber Safety Quiz</span>
            </a>
            <a class="il-stop" href="pages/password-checker.html" data-go="1" aria-controls="titleCard">
                <span class="il-stop-n" aria-hidden="true">2</span>
                <span class="il-stop-label" data-i18n="common.passwordChecker">Password Checker</span>
            </a>
            <a class="il-stop" href="pages/passphrase-maker.html" data-go="2" aria-controls="titleCard">
                <span class="il-stop-n" aria-hidden="true">3</span>
                <span class="il-stop-label" data-i18n="common.passphraseMaker">Passphrase Maker</span>
            </a>
            <a class="il-stop" href="pages/sticker-generator.html" data-go="3" aria-controls="titleCard">
                <span class="il-stop-n" aria-hidden="true">4</span>
                <span class="il-stop-label" data-i18n="common.stickerStudio">Keychain Studio</span>
            </a>
        </nav>
        <div class="language-control">
            <label for="languageSelect" data-i18n="common.language">Language</label>
            <select id="languageSelect" data-language-select>
                <option value="en" lang="en">English</option>
                <option value="zh-CN" lang="zh-CN">简体中文</option>
                <option value="zh-TW" lang="zh-TW">繁體中文</option>
                <option value="vi" lang="vi">Tiếng Việt</option>
                <option value="fr" lang="fr">Français</option>
                <option value="de" lang="de">Deutsch</option>
            </select>
        </div>
    </header>


    <!-- The world. Each scene is split at its drawn title card: the back plane is painted
         before the card, the front plane (hills, people, mascot) after it -->
    <div id="world" class="world">

        <!-- Layer 1: the illustrated environment -->
        <div id="planeBack" class="plane plane-back" aria-hidden="true"></div>
        <div class="ground" aria-hidden="true"></div>

        <!-- Layer 2: one persistent title card; home.js fills it and flips it -->
        <main class="card-slot">
            <article class="card" id="titleCard" tabindex="-1" aria-live="polite" aria-atomic="true" aria-labelledby="cardTitle">
                <h1 class="card-title" id="cardTitle"></h1>
                <p class="card-lede" id="cardLede"></p>
                <a class="card-cta" id="cardCta" href="pages/cyber-quiz.html"><span id="cardCtaText"></span></a>
            </article>
        </main>

        <div id="planeFront" class="plane plane-front" aria-hidden="true"></div>

    </div>


    <!-- The mascot's speech bubble (poke the mascot) and the sparkles from tapping the illustration -->
    <div class="bot-bubble" id="botBubble" role="status"><p id="botBubbleText"></p></div>
    <div id="fx" aria-hidden="true"></div>


    <!-- Rises over the page on the way into an activity -->
    <div id="curtain" aria-hidden="true"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path id="curtainPath" d="M0 100 H100 V100 H0Z"/></svg></div>


    <script src="languages/en.js"></script>
    <script src="languages/zh-CN.js"></script>
    <script src="languages/zh-TW.js"></script>
    <script src="languages/vi.js"></script>
    <script src="languages/fr.js"></script>
    <script src="languages/de.js"></script>
    <script src="js/i18n.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="js/home-scenes.js"></script>
    <script src="js/home.js"></script>

</body>

</html>
